name: Deploy web

# The page is a static shell, no build step: pushing main uploads src/web/ to
# countmein.itsybit.se. The API module ships separately on a version tag
# (publish.yml), because the two have different blast radii.
on:
  push:
    branches: [main]
  # After a release's module is published (not on the tag push itself: both share the one
  # self-hosted runner, and a deploy waiting there for the host would block the publish it waits for).
  workflow_run:
    workflows: [Publish module]
    types: [completed]
  workflow_dispatch:

# API ships before web (Jocelyn, 2026-11-06): the pages must never call an endpoint the host doesn't have yet.
#  - A push to main that changes src/api/ runs the tests but doesn't upload: tag a release (vX.Y.Z).
#  - On that tag, publish.yml ships the module and the host redeploys. When the publish has finished,
#    this runs, waits until the host's GET /api/countmein/version says X.Y.Z, then uploads the pages.
#  - A push to main that changes only the web uploads at once, as before.
jobs:
  gate:
    name: API before web
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    outputs:
      hold: ${{ steps.check.outputs.hold }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}   # a release deploys its own commit
      - id: check
        env:
          BEFORE: ${{ github.event.before }}
          RELEASE: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            want="${RELEASE#v}"
            url="https://labsapi-hmeva5cfhdfkejhz.westeurope-01.azurewebsites.net/api/countmein/version"
            for i in $(seq 1 60); do   # up to ~30 minutes: publish, then the host's deploy
              got=$(curl -fsS "$url" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' 2>/dev/null || true)
              echo "host runs ${got:-?}, waiting for $want"
              if [ "$got" = "$want" ]; then echo "hold=false" >> "$GITHUB_OUTPUT"; exit 0; fi
              sleep 30
            done
            echo "::error::The host never reported $want. Check the publish and the host's Deploy to Azure, then run this workflow again."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "${BEFORE:-}" ] && ! [[ "$BEFORE" =~ ^0+$ ]] \
             && git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -q '^src/api/'; then
            echo "::notice::This push changes the API, so the pages wait for its release: tag vX.Y.Z and they upload once the host has it."
            echo "hold=true" >> "$GITHUB_OUTPUT"
          else
            echo "hold=false" >> "$GITHUB_OUTPUT"
          fi

  # The page decides nothing: its screens draw the API's views through components. `npm test` runs a
  # component test per view and a structure test that keeps logic out of the page. The rules live in
  # the API module's Decide slices; their Given/When/Then specs gate every deploy too, and on
  # Jocelyn's machine the deploy saves the web's build book (count-me-in-web); the API's is saved by publish.yml.
  test:
    name: Tests + Event Book model
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}   # a release deploys its own commit

      - name: Page tests (components and structure)
        run: npm test

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet

      # The server's tests restore ItsyBIT packages from the private feed; see publish.yml.
      - name: Configure NuGet
        run: |
          dotnet nuget update source github \
            --username jocelynenglund \
            --password ${{ secrets.NUGET_AUTH_TOKEN || secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text

      # The server's rules: the xunit endpoint tests plus the Given/When/Then specs of the four
      # command slices. With GWT_EXPORT they write the model the API's build book is made from.
      - name: Server tests (export the model)
        env:
          GWT_EXPORT: ${{ runner.temp }}/gwt-api
        run: dotnet test tests/CountMeIn.Tests

      # The screens, observed: each screen runs against a recording fetch (tests/screens-pass.test.mjs), and
      # this time with the API's route list from the server tests, so it also fails on a route the API lacks
      # or a view or command of the API that no screen calls. SCREENS_OUT is what it saw.
      - name: Screens pass (observe the screens, check them against the API)
        env:
          API_ROUTES: ${{ runner.temp }}/gwt-api/routes.json
          SCREENS_OUT: ${{ runner.temp }}/screens.json
        run: node --test tests/screens-pass.test.mjs

      # The web's own book: one scenario per component test, then the screens that showed each component.
      - name: Component tests (export the web's model)
        env:
          GWT_EXPORT: ${{ runner.temp }}/gwt-web
        run: node --test tests/components/*.test.mjs

      # The web's build book (count-me-in-web: the components, with the screens that showed them).
      # It is saved by the deploy job below, only once these pages are uploaded, so the book is what
      # went live. The API's book (count-me-in-api) is saved by publish.yml on a release only: a push
      # to main doesn't change what the host runs.
      - name: Put the screens into the web's book
        run: python3 -I scripts/add-screens.py --web "$RUNNER_TEMP/gwt-web" "$RUNNER_TEMP/screens.json" "$RUNNER_TEMP/gwt-api"

      - uses: actions/upload-artifact@v4
        with:
          name: gwt-web
          path: ${{ runner.temp }}/gwt-web
          retention-days: 1

  deploy:
    needs: [test, gate]
    if: needs.gate.outputs.hold != 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # whats-new.sh reads the full history
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}   # a release deploys its own commit

      - name: Generate whats-new.json
        run: ./whats-new.sh src/web/whats-new.json

      # ?v=<sha> on css/js refs, so a deploy is picked up at once. app.mjs imports
      # its slices by relative path; web.config sends no-cache, so those revalidate.
      - name: Cache-bust
        run: |
          VERSION="${GITHUB_SHA::7}"
          find src/web -name "*.html" -print0 | xargs -0 sed -i -E \
            -e "s#(href=\"[^\"]+\\.css)\"#\\1?v=${VERSION}\"#g" \
            -e "s#(src=\"[^\"]+\\.m?js)\"#\\1?v=${VERSION}\"#g"

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./src/web/
          server-dir: /countmein/

      # The old address, prototype.itsybit.se, forwards old links (and the owner key and
      # device id its browser storage holds) to countmein.itsybit.se.
      - name: Keep prototype.itsybit.se forwarding
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./redirect/
          server-dir: /prototype/

      # The web's build book, saved only now that these pages are live, at the commit that was uploaded
      # (this checkout), so its code links point at the code people are using.
      - uses: actions/download-artifact@v4
        with:
          name: gwt-web
          path: ${{ runner.temp }}/gwt-web

      - name: Save the web's Event Book model (this deploy)
        run: python3 -I scripts/save-gwt-export.py --app count-me-in-web "$RUNNER_TEMP/gwt-web"
